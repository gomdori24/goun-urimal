<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고운 우리말 찾기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gowun+Batang:wght@400;700&family=Jua&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7efe2;--card:#fffaf2;--ink:#4a3f35;--soft:#8a7a69;--line:#eadcc6;--accent:#e59a7a;--accent2:#7fb7a4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum",system-ui,sans-serif;line-height:1.6}
header{padding:36px 20px 18px;text-align:center}
h1{font-family:"Jua",sans-serif;font-weight:400;font-size:clamp(30px,6vw,46px);margin:0;letter-spacing:1px}
h1 span{color:var(--accent)}
.sub{color:var(--soft);margin:6px 0 20px;font-size:17px}
form{display:flex;gap:8px;max-width:560px;margin:0 auto}
input[type=search]{flex:1;font:inherit;font-size:20px;padding:14px 20px;border:2px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);outline:none}
input[type=search]:focus{border-color:var(--accent)}
button{font:inherit;cursor:pointer}
.go{font-family:"Jua";font-size:20px;padding:0 26px;border:0;border-radius:999px;background:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:860px;margin:18px auto 0}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:16px;color:var(--ink)}
.chip:hover,.chip.on{background:#fff;border-color:var(--accent);color:var(--accent)}
.rand{border-style:dashed}
main{max-width:1080px;margin:0 auto;padding:10px 18px 60px}
.topic{margin-top:28px}
.banner{border-radius:24px;overflow:hidden;display:flex;align-items:center;gap:18px;padding:0 26px;height:120px;position:relative}
.banner .big{font-size:64px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.08))}
.banner h2{font-family:"Jua";font-weight:400;font-size:34px;margin:0}
.banner p{margin:0;color:var(--soft)}
.banner svg{position:absolute;right:0;top:0;height:100%;opacity:.9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;margin-top:16px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:0;overflow:hidden;display:flex;flex-direction:column}
.pic{height:110px;display:flex;align-items:center;justify-content:center;font-size:54px;letter-spacing:4px;position:relative}
.pic::after{content:"";position:absolute;inset:auto 0 0 0;height:22px;background:linear-gradient(transparent,rgba(255,250,242,.9))}
.body{padding:14px 20px 18px;flex:1;display:flex;flex-direction:column}
.word{font-family:"Gowun Batang",serif;font-weight:700;font-size:34px;margin:0;line-height:1.2}
.tag{display:inline-block;font-size:12px;background:#f1e4cf;color:var(--soft);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.mean{font-size:18px;margin:6px 0 8px;font-weight:700;color:#6b5646}
.desc{font-size:15.5px;margin:0 0 10px;color:#5d5045}
.ex{font-family:"Gowun Batang",serif;font-size:15px;background:#fff;border-left:4px solid var(--accent2);padding:6px 12px;border-radius:0 10px 10px 0;margin:0 0 12px}
.acts{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 12px;font-size:14px;color:var(--ink);text-decoration:none}
.btn.main{background:var(--accent2);border-color:var(--accent2);color:#fff}
.empty{text-align:center;color:var(--soft);padding:40px 10px;font-size:18px}
.note{max-width:860px;margin:40px auto 0;text-align:center;font-size:14px;color:var(--soft)}
/* 미리보기 */
.dim{position:fixed;inset:0;background:rgba(74,63,53,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.dim.show{display:flex}
.modal{background:var(--card);border-radius:24px;padding:24px;max-width:460px;width:100%;text-align:center}
.modal h3{font-family:"Jua";font-weight:400;font-size:26px;margin:0 0 4px}
.modal .hint{font-size:14px;color:var(--soft);margin:0 0 14px}
.badge{width:300px;height:300px;margin:0 auto;border-radius:50%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid #cbb9a0;overflow:hidden}
.badge .ring{position:absolute;width:83.45%;height:83.45%;border-radius:50%;border:2px dashed rgba(0,0,0,.25)}
.badge .bw{font-family:"Gowun Batang",serif;font-weight:700;font-size:56px;line-height:1.1;z-index:1}
.badge .be{font-size:40px;z-index:1}
.badge .bm{font-size:15px;max-width:62%;z-index:1;margin-top:4px}
.swatch{display:flex;gap:8px;justify-content:center;margin:16px 0 10px}
.swatch button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line)}
.opts{display:flex;gap:14px;justify-content:center;font-size:15px;margin-bottom:14px}
.close{font-family:"Jua";font-size:18px;border:0;background:var(--accent);color:#fff;border-radius:999px;padding:8px 30px}
@media (max-width:520px){.banner{height:96px}.banner .big{font-size:46px}.banner h2{font-size:26px}.badge{width:250px;height:250px}.badge .bw{font-size:44px}}
</style>
</head>
<body>
<header>
  <h1>고운 <span>우리말</span> 찾기</h1>
  <p class="sub">주제어를 입력하면 어울리는 순우리말을 찾아 줘요</p>
  <form id="f" autocomplete="off">
    <input type="search" id="q" placeholder="예) 바다, 학교, 하늘, 꽃" maxlength="12" aria-label="주제어">
    <button class="go" type="submit">찾기</button>
  </form>
  <div class="chips" id="chips"></div>
</header>
<main id="out"></main>
<p class="note">🔒 입력한 낱말은 이 화면 안에서만 쓰이고, 어디에도 저장되거나 전송되지 않아요. 이름 같은 개인정보는 적지 않아요.<br>뜻풀이는 표준국어대사전을 바탕으로 쉽게 풀어 썼어요. 정확한 뜻은 ‘사전 확인’ 버튼으로 살펴보세요.</p>

<div class="dim" id="dim" role="dialog" aria-modal="true">
  <div class="modal">
    <h3>뱃지 미리보기</h3>
    <p class="hint">점선 안쪽이 뱃지 앞면(58mm)에 보이는 부분이에요</p>
    <div class="badge" id="badge"><div class="ring"></div><div class="be" id="be"></div><div class="bw" id="bw"></div><div class="bm" id="bm"></div></div>
    <div class="swatch" id="sw"></div>
    <div class="opts">
      <label><input type="checkbox" id="oe" checked> 그림</label>
      <label><input type="checkbox" id="om" checked> 뜻</label>
    </div>
    <button class="close" id="x">닫기</button>
  </div>
</div>

<script>
// [낱말, 뜻, 자세한 설명, 그림(이모지), 예문, 메모(선택)]
const TOPICS = [
 {name:"바다", emoji:"🌊", c:["#bfe3f0","#e6f6fb"], keys:["바다","파도","물결","해변","바닷가","갯벌","섬","배","항구","해양","여름바다"], words:[
  ["윤슬","햇빛이나 달빛에 비쳐 반짝이는 잔물결","해가 비치는 바다나 강을 보면 물결 위에서 작은 빛이 수없이 반짝여요. 그 반짝이는 잔물결을 부르는 이름이에요.","✨🌊","노을 진 바다 위로 윤슬이 반짝였다."],
  ["물비늘","잔잔한 물결이 햇살에 비쳐 비늘처럼 반짝이는 모양","물고기 비늘이 반짝이는 모습에 빗댄 말이에요. 잔잔한 물 위의 빛 무늬를 떠올리면 돼요.","🐟✨","호수에 물비늘이 일렁였다."],
  ["너울","바다에서 크고 사납게 일어나는 물결","바람이 세게 불 때 바다에서 크게 넘실대며 밀려오는 물결이에요. 너울이 일 때는 바닷가에 가까이 가면 위험해요.","🌊🌊","태풍이 오자 높은 너울이 밀려왔다."],
  ["물마루","높이 솟은 물결의 꼭대기, 또는 수평선 쪽의 솟아 보이는 부분","파도가 가장 높이 솟은 부분을 '마루(꼭대기)'에 빗대어 부르는 말이에요. 멀리 수평선을 가리킬 때도 써요.","⛵","배가 물마루를 넘어 사라졌다."],
  ["물보라","물결이 바위 등에 부딪쳐 흩어지는 잔 물방울","파도가 바위에 부딪힐 때 하얗게 튀어 오르는 물방울 안개를 말해요.","💦🪨","바위에 부딪친 파도가 하얀 물보라를 일으켰다."],
  ["난바다","육지에서 멀리 떨어진 넓은 바다","육지에서 가까운 바다는 '든바다', 멀리 떨어진 넓은 바다는 '난바다'라고 해요.","🚢","고깃배가 난바다로 나아갔다."],
  ["갯내","바닷물에서 나는 짭짤하고 비릿한 냄새","바닷가에 가면 코끝에 느껴지는 바다 냄새를 한 낱말로 부르는 말이에요.","🦀","바람에 실려 갯내가 풍겨 왔다."]
 ]},
 {name:"하늘", emoji:"☁️", c:["#cfe4ff","#eef5ff"], keys:["하늘","구름","노을","무지개","해","아침","저녁","공기","날씨"], words:[
  ["노을","해가 뜨거나 질 때 하늘이 붉게 물드는 모습","아침에 생기면 '아침놀', 저녁에 생기면 '저녁놀'이라고도 해요.","🌅","저녁 노을이 하늘을 주황빛으로 물들였다."],
  ["햇귀","해가 처음 솟을 때 비치는 빛","아침 해가 막 떠오를 때 퍼지는 첫 햇빛을 말해요. 새로 시작하는 마음을 담기 좋아요.","🌄","산 너머로 햇귀가 퍼졌다."],
  ["해넘이","해가 막 넘어가는 때, 또는 그 모습","해가 지는 모습이에요. 해가 떠오르는 것은 '해돋이'라고 해요.","🌇","바닷가에서 해넘이를 바라보았다."],
  ["땅거미","해가 진 뒤 어둑어둑해지는 때","해가 지고 밤이 오기 전, 주위가 조금씩 어두워지는 시간을 말해요.","🌆","땅거미가 내려앉자 가로등이 켜졌다."],
  ["뭉게구름","솜을 뭉쳐 놓은 것처럼 몽실몽실한 구름","맑은 여름 하늘에 잘 보이는, 위로 둥글게 솟은 구름이에요.","☁️","파란 하늘에 뭉게구름이 피어올랐다."],
  ["새털구름","새의 깃털처럼 가늘고 하얗게 퍼진 구름","하늘 높이 얇게 흩어진 구름이에요. 가을 하늘에서 자주 볼 수 있어요.","🪶","높은 하늘에 새털구름이 흩어져 있었다."],
  ["하늘가","하늘의 끝, 하늘과 땅이 맞닿아 보이는 곳","눈으로 볼 수 있는 하늘의 가장 먼 가장자리를 말해요.","🌈","무지개가 하늘가까지 이어졌다."]
 ]},
 {name:"별과 밤", emoji:"🌙", c:["#c9c6f2","#ecebfb"], keys:["별","밤","달","우주","은하수","별자리","행성","금성","저녁하늘","밤하늘"], words:[
  ["샛별","새벽에 동쪽 하늘에서 밝게 빛나는 금성","새벽에 가장 밝게 반짝이는 별이에요. 앞날이 기대되는 사람을 '샛별'이라고 부르기도 해요.","🌟","새벽하늘에 샛별이 반짝였다."],
  ["개밥바라기","저녁에 서쪽 하늘에 보이는 금성","저녁밥 먹을 때쯤 보이는 별이라서, 개가 밥을 바란다는 뜻이 담긴 재미있는 이름이에요.","🐶⭐","서쪽 하늘에 개밥바라기가 떴다."],
  ["미리내","은하수를 이르는 제주도 말","'미르(용)'와 '내(시내)'가 합쳐진 말로, 용이 사는 시내라는 뜻으로 풀이하기도 해요.","🌌","밤하늘에 미리내가 길게 흘렀다.","제주 지역말(방언)"],
  ["별똥별","밤하늘에 빛을 내며 떨어지는 별","우주의 작은 돌이 공기와 부딪쳐 타면서 빛나는 것이에요. '유성'의 순우리말이에요.","🌠","별똥별을 보며 소원을 빌었다."],
  ["달무리","달 둘레에 생기는 둥근 빛의 테","얇은 구름이 끼었을 때 달 주위에 동그란 빛의 고리가 생겨요.","🌕","오늘 밤은 달무리가 졌다."],
  ["으스름달","흐릿하고 침침하게 비치는 달","구름에 살짝 가려져 희미하게 보이는 달빛이에요.","🌫️🌙","으스름달 아래 골목이 고요했다."],
  ["별무리","무리를 지어 모여 있는 별들","밤하늘에 여러 별이 모여 반짝이는 모습이에요.","✨⭐✨","산 위에서 별무리를 올려다보았다."]
 ]},
 {name:"꽃", emoji:"🌸", c:["#ffd3e0","#fff0f4"], keys:["꽃","봄꽃","식물","정원","벚꽃","장미","꽃잎","화단","풀","새싹"], words:[
  ["꽃망울","아직 피지 않은 어린 꽃봉오리","곧 피어날 준비를 하는 작고 동그란 꽃봉오리예요. 앞으로 피어날 우리 모습과 닮았어요.","🌷","가지마다 꽃망울이 맺혔다."],
  ["꽃보라","바람에 흩날리며 떨어지는 많은 꽃잎","꽃잎이 눈보라처럼 흩날리는 모습을 말해요.","🌸💨","벚나무 아래로 꽃보라가 날렸다."],
  ["꽃샘","이른 봄, 꽃 필 무렵에 갑자기 추워지는 일","추위가 꽃을 시샘한다는 뜻이에요. '꽃샘추위'라고 많이 써요.","🥶🌼","꽃샘추위에 외투를 다시 꺼냈다."],

  ["함초롬하다","젖거나 서린 모습이 가지런하고 차분하다","이슬을 머금은 꽃이나 풀이 단정하고 촉촉하게 보이는 모습을 표현해요.","🌼💧","이슬 맞은 꽃잎이 함초롬하다."],
  ["꽃눈","자라서 꽃이 될 눈(싹)","나무나 풀에서 나중에 꽃으로 피어날 작은 눈이에요.","🌱","겨울에도 나뭇가지에 꽃눈이 숨어 있다."]
 ]},
 {name:"학교", emoji:"🏫", c:["#ffe6b8","#fff6e3"], keys:["학교","공부","교실","선생님","배움","수업","책","학생","교과서","급식"], words:[
  ["배움터","배우는 곳","학교처럼 무언가를 배우는 장소를 말해요.","🏫","우리 학교는 즐거운 배움터이다."],
  ["슬기","일의 이치를 바르게 알고 잘 해결하는 지혜","어려운 일도 차근차근 생각해서 잘 풀어 가는 힘이에요.","💡","슬기를 모아 문제를 해결했다."],
  ["길잡이","길을 안내해 주는 사람이나 물건","앞에서 방향을 알려 주는 사람이나, 나아갈 길을 밝혀 주는 것을 말해요.","🧭","선생님은 우리의 길잡이이시다."],
  ["마중물","펌프에서 물을 끌어올리려고 먼저 붓는 물","옛날 펌프는 물을 한 바가지 부어야 땅속 물이 올라왔어요. 그래서 어떤 일을 시작하게 도와주는 것을 뜻하기도 해요.","🚰","친구의 응원이 나에게 마중물이 되었다."],
  ["늘품","앞으로 좋게 발전할 가능성","지금보다 더 크게 자라고 좋아질 수 있는 바탕을 말해요.","📈","너는 늘품이 있는 친구야."],
  ["깜냥","스스로 일을 헤아려 해낼 수 있는 능력","자기가 할 수 있는 만큼의 힘을 말해요.","💪","내 깜냥껏 최선을 다했다."],
  ["도란도란","여럿이 나직한 목소리로 정답게 이야기하는 모양","친구들과 다정하게 이야기 나누는 소리나 모습을 표현해요.","🗨️","쉬는 시간에 도란도란 이야기를 나눴다."]
 ]},

(function(){
  const $=s=>document.querySelector(s);
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const norm=s=>String(s).replace(/\s+/g,"").toLowerCase();
  const dict=w=>"https://stdict.korean.go.kr/search/searchResult.do?searchKeyword="+encodeURIComponent(w.replace(/다$/,"다"));

  // 주제 칩
  const chips=$("#chips");
  TOPICS.forEach(t=>{const b=document.createElement("button");b.className="chip";b.type="button";b.textContent=t.emoji+" "+t.name;b.onclick=()=>{$("#q").value=t.name;run(t.name)};chips.appendChild(b)});
  const r=document.createElement("button");r.className="chip rand";r.type="button";r.textContent="🎲 아무 우리말이나!";r.onclick=random;chips.appendChild(r);

  function scene(t){ // 주제 배너 장식 (그림)
    const e=[...t.emoji].slice(0,2).join("");
    let dots="";for(let i=0;i<14;i++){const x=40+((i*53)%260),y=12+((i*37)%96),r=2+(i%4);dots+=`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" opacity="${.35+(i%3)*.2}"/>`}
    return `<svg viewBox="0 0 320 120" aria-hidden="true"><path d="M0 120 C60 70 120 110 180 80 S280 60 320 70 V120Z" fill="#fff" opacity=".45"/><path d="M40 120 C100 95 160 120 220 100 S300 95 320 100 V120Z" fill="#fff" opacity=".55"/>${dots}<text x="250" y="78" font-size="46" text-anchor="middle">${e}</text></svg>`;
  }
  function card(w,t){
    const [word,mean,desc,emo,ex,memo]=w;
    return `<article class="card"><div class="pic" style="background:linear-gradient(135deg,${t.c[0]},${t.c[1]})">${esc(emo)}</div>
    <div class="body"><h3 class="word">${esc(word)}${memo?`<span class="tag">${esc(memo)}</span>`:""}</h3>
    <p class="mean">${esc(mean)}</p><p class="desc">${esc(desc)}</p><p class="ex">${esc(ex)}</p>
    <div class="acts"><button class="btn main" type="button" data-w="${esc(word)}" data-t="${esc(t.name)}">🔘 뱃지에 담아 보기</button>
    <a class="btn" href="${dict(word)}" target="_blank" rel="noopener noreferrer">📖 사전 확인</a></div></div></article>`;
  }
  function section(t,list,title){
    return `<section class="topic"><div class="banner" style="background:linear-gradient(120deg,${t.c[0]},${t.c[1]})"><div class="big">${t.emoji}</div><div><h2>${esc(title||t.name)}</h2><p>${list.length}개의 고운 우리말</p></div>${scene(t)}</div><div class="grid">${list.map(w=>card(w,t)).join("")}</div></section>`;
  }
  function run(raw){
    const q=norm(raw);
    [...chips.children].forEach(c=>c.classList.toggle("on",q&&norm(c.textContent).includes(q)));
    if(!q){$("#out").innerHTML=`<p class="empty">위에서 주제를 고르거나 낱말을 입력해 보세요 🙂</p>`;return}
    const hitT=[],seen=new Set();
    TOPICS.forEach(t=>{
      const keys=[t.name,...t.keys].map(norm);
      let s=0; if(keys.includes(q))s=3; else if(keys.some(k=>k.length>1&&(k.includes(q)||q.includes(k))))s=2;
      if(s)hitT.push([s,t]);
    });
    hitT.sort((a,b)=>b[0]-a[0]);
    let html=hitT.map(([,t])=>{t.words.forEach(w=>seen.add(w[0]));return section(t,t.words)}).join("");
    // 낱말·뜻 속에서 찾기
    const extra=[];
    TOPICS.forEach(t=>t.words.forEach(w=>{
      if(seen.has(w[0]))return;
      if(norm(w[0]).includes(q)||norm(w[1]).includes(q)||norm(w[2]).includes(q)){seen.add(w[0]);extra.push([w,t])}
    }));
    if(extra.length){
      html+=`<section class="topic"><div class="banner" style="background:linear-gradient(120deg,#efe3cf,#fbf5ea)"><div class="big">🔎</div><div><h2>‘${esc(raw.trim())}’와(과) 이어지는 말</h2><p>뜻풀이에 이 낱말이 들어 있어요</p></div></div><div class="grid">${extra.map(([w,t])=>card(w,t)).join("")}</div></section>`;
    }
    if(!html){html=`<p class="empty">‘${esc(raw.trim())}’에 맞는 우리말을 아직 못 찾았어요.<br>비슷한 주제를 눌러 볼까요?</p>`}
    $("#out").innerHTML=html;
  }
  function random(){
    const t=TOPICS[Math.floor(Math.random()*TOPICS.length)];
    const w=t.words[Math.floor(Math.random()*t.words.length)];
    $("#q").value="";[...chips.children].forEach(c=>c.classList.remove("on"));
    $("#out").innerHTML=section(t,[w],"오늘의 우리말");
  }
  $("#f").addEventListener("submit",e=>{e.preventDefault();run($("#q").value)});

  // 뱃지 미리보기
  const COLORS=["#fffaf2","#ffe3ea","#e3f1ff","#e4f6e7","#fff3c4","#ece3fb","#ffe2cc"];
  let cur=null,bg=COLORS[0];
  const sw=$("#sw");
  COLORS.forEach(c=>{const b=document.createElement("button");b.type="button";b.style.background=c;b.setAttribute("aria-label","배경색");b.onclick=()=>{bg=c;paint()};sw.appendChild(b)});
  function paint(){if(!cur)return;const [w,t]=cur;
    $("#badge").style.background=bg;$("#bw").textContent=w[0];
    $("#be").textContent=$("#oe").checked?w[3]:"";$("#bm").textContent=$("#om").checked?w[1]:"";
    $("#bw").style.fontSize=(w[0].length>4?(w[0].length>5?34:42):56)+"px";}
  $("#oe").onchange=paint;$("#om").onchange=paint;
  document.addEventListener("click",e=>{const b=e.target.closest("[data-w]");if(!b)return;
    const t=TOPICS.find(x=>x.name===b.dataset.t);const w=t.words.find(x=>x[0]===b.dataset.w);
    cur=[w,t];paint();$("#dim").classList.add("show");});
  $("#x").onclick=()=>$("#dim").classList.remove("show");
  $("#dim").addEventListener("click",e=>{if(e.target.id==="dim")$("#dim").classList.remove("show")});
  run("");
})();
</script>
</body>
</html>
